<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unirse a grupo · Porras Mundial 2026</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F6F7F5; color: #13201B;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px; text-align: center;
    }
    .card {
      background: #fff; border-radius: 18px; padding: 32px 24px;
      box-shadow: 0 6px 24px rgba(19,32,27,0.08); max-width: 360px; width: 100%;
    }
    .logo { font-size: 56px; margin-bottom: 8px; }
    h1 { font-size: 22px; margin-bottom: 6px; }
    p { color: #6B7770; font-size: 15px; line-height: 1.5; margin-bottom: 20px; }
    .code {
      display: inline-block; background: #E7F3ED; color: #0B7A55;
      font-size: 28px; font-weight: 800; letter-spacing: 6px;
      padding: 12px 20px; border-radius: 12px; margin-bottom: 24px;
    }
    .btn {
      display: block; background: #0B7A55; color: #fff; text-decoration: none;
      font-size: 16px; font-weight: 700; padding: 16px; border-radius: 14px;
      margin-bottom: 12px;
    }
    .hint { font-size: 13px; color: #9AA39D; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🏆</div>
    <h1>Únete al grupo</h1>
    <p>Te han invitado a un grupo en Porras Mundial 2026</p>
    <div class="code" id="code">------</div>
    <a class="btn" id="openApp" href="#">Abrir en la app</a>
    <a class="btn" style="background:#fff;color:#0B7A55;border:1px solid #E9ECE8;" href="https://play.google.com/apps/testing/com.porrasmundial.app">Instalar la app</a>
    <p class="hint">Si aún no tienes la app, pulsa "Instalar la app", únete a la prueba e instálala. Luego vuelve aquí. Tu código es el de arriba.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = (params.get('code') || '').toUpperCase();
    document.getElementById('code').textContent = code || '------';
    const deepLink = 'porras-mundial://grupo/unirse?code=' + code;
    document.getElementById('openApp').href = deepLink;
    // Intento de apertura automática
    if (code) {
      setTimeout(function () { window.location.href = deepLink; }, 600);
    }
  </script>
</body>
</html>
