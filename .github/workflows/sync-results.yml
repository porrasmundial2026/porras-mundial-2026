name: Sincronizar resultados Mundial 2026

on:
  schedule:
    # Mundial 2026: 11 junio – 19 julio. Cada 30 min, todas las horas.
    # GitHub descarta menos los cron poco frecuentes que los de cada 10 min.
    # Aun asi puede retrasar/saltar alguna; el panel admin sirve de respaldo.
    - cron: '0,30 * * 6,7 *'
  workflow_dispatch:  # Permite lanzarlo manualmente desde GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install
        working-directory: scripts

      - name: Sincronizar resultados
        run: node sync-results.js
        working-directory: scripts
        env:
          FOOTBALL_API_TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
